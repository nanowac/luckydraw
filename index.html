<script>
window.addEventListener('DOMContentLoaded', () => {
  const byId = id => document.getElementById(id);
  const prizeToggle = byId('prize-toggle');
  const prizeWindow = byId('prize-window');
  prizeToggle.addEventListener('click', () => {
    const paused = prizeWindow.toggleAttribute('data-paused');
    if (!paused) prizeWindow.scrollLeft = 0;
    prizeToggle.textContent = paused ? 'เล่นต่อ' : 'หยุดเลื่อน';
  });
  const data = window.ticketPool;
  if (!data) {
    byId('status').textContent = 'โหลดข้อมูล Pool ไม่สำเร็จ';
    byId('search').disabled = true;
    return;
  }
  const number = new Intl.NumberFormat('th-TH');
  const accounts = data.accounts;
  const size = 15;
  let page = 0;
  byId('demo').hidden = !data.demo;
  byId('updated').textContent = data.updatedAt ? 'อัปเดต ' + new Intl.DateTimeFormat('th-TH', {
    dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Bangkok'
  }).format(new Date(data.updatedAt)) + ' (เวลาไทย)' : '';
  byId('total').textContent = number.format(accounts.reduce((sum, row) => sum + row.tickets, 0));
  byId('members').textContent = number.format(accounts.length);
  function render() {
    const query = byId('search').value.trim().toLowerCase();
    const matches = accounts.filter(row => row.masked.toLowerCase().includes(query));
    const pages = Math.ceil(matches.length / size);
    byId('status').textContent = matches.length ? 'พบ ' + number.format(matches.length) + ' บัญชี'
      : query ? 'ไม่พบบัญชีที่ตรงกับคำค้น' : 'ยังไม่มีสิทธิ์ใน Pool';
    const rows = matches.slice(page * size, (page + 1) * size).map(account => {
      const tr = document.createElement('tr');
      tr.insertCell().textContent = account.masked;
      return tr;
    });
    byId('rows').replaceChildren(...rows);
    byId('pagination').style.display = pages > 1 ? 'flex' : 'none';
    byId('pagination').hidden = pages <= 1;
    byId('page').textContent = 'หน้า ' + (page + 1) + ' / ' + pages;
    byId('prev').disabled = page === 0;
    byId('next').disabled = page + 1 >= pages;
  }
  byId('search').addEventListener('input', () => { page = 0; render(); });
  byId('prev').addEventListener('click', () => { page--; render(); });
  byId('next').addEventListener('click', () => { page++; render(); });
  render();
});
</script>
