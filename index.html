.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}

.stats strong{display:block;font-size:clamp(1.6rem,6vw,2.6rem);color:#f3cb79}
label{display:block;font-weight:700;margin-bottom:8px}

input{width:100%;background:#15130f;color:inherit}button{background:#332817;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid #f3cb79;outline-offset:3px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 4px;border-bottom:1px solid #473a29}
th:last-child,td:last-child{text-align:right}
nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
#demo{color:#f3cb79;font-weight:700}
.prizes{margin:0 0 20px}.prize-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.prize-heading h2{margin:0;font-size:1.25rem}.prize-window{overflow:auto;border-radius:12px;scrollbar-width:thin}.prize-track{display:flex;width:max-content;animation:prize-scroll 26s linear infinite}.prize-group{display:flex;gap:12px;padding-right:12px}.prize-card{width:160px;margin:0;padding:10px;background:#1c1914;border:1px solid #4f402a;border-radius:12px;text-align:center}.prize-card img{display:block;width:100%;height:96px;object-fit:contain;background:#f8f3e9;border-radius:8px;padding:5px}.prize-card figcaption{font-size:.85rem;margin-top:8px}.prize-window:hover .prize-track,.prize-window:focus-within .prize-track,.prize-window[data-paused] .prize-track{animation-play-state:paused}.prize-window[data-paused] .prize-group[aria-hidden]{display:none}.prize-window[data-paused] .prize-track{animation:none}
@keyframes prize-scroll{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.prize-track{animation:none}.prize-group[aria-hidden],#prize-toggle{display:none}}
</style>
<script>window.ticketPool = {"demo":true,"updatedAt":null,"accounts":[{"masked":"naXXX88","tickets":3},{"masked":"miXXX42","tickets":5},{"masked":"soXXX19","tickets":2}]};</script>
</head>
<body>
<main>
<a href="https://lucky-live-nano-1030.adisorn160.chatgpt.site/">← กลับไปหน้า Lucky Live</a>
<header>
<div class="brand">LUCKY LIVE</div>
<h1>Ticket Pool</h1>
<p>ตรวจสอบจำนวนสิทธิ์ของสมาชิกในรอบกิจกรรม</p>
<div id="demo" hidden>ข้อมูลตัวอย่าง</div>
<p id="updated"></p>
</header>
<section class="prizes" aria-labelledby="prize-title">
<div class="prize-heading"><h2 id="prize-title">ของรางวัล Lucky Live</h2><button type="button" id="prize-toggle" aria-controls="prize-window">หยุดเลื่อน</button></div>
<div class="prize-window" id="prize-window" tabindex="0" aria-label="เลื่อนดูรูปของรางวัล"><div class="prize-track"><div class="prize-group"><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/s26.png" alt="" width="128" height="96"><figcaption>Samsung Galaxy S26</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/watch8.webp" alt="" width="128" height="96"><figcaption>Samsung Galaxy Watch 8 40mm</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/buds3.webp" alt="" width="128" height="96"><figcaption>Samsung Galaxy Buds 3 FE</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/trip.svg" alt="" width="128" height="96"><figcaption>Trip.com Voucher</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/line.svg" alt="" width="128" height="96"><figcaption>LINE Gift</figcaption></figure></div><div class="prize-group" aria-hidden="true"><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/s26.png" alt="" width="128" height="96"><figcaption>Samsung Galaxy S26</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/watch8.webp" alt="" width="128" height="96"><figcaption>Samsung Galaxy Watch 8 40mm</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/buds3.webp" alt="" width="128" height="96"><figcaption>Samsung Galaxy Buds 3 FE</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/trip.svg" alt="" width="128" height="96"><figcaption>Trip.com Voucher</figcaption></figure><figure class="prize-card"><img src="https://lucky-live-nano-1030.adisorn160.chatgpt.site/prizes/line.svg" alt="" width="128" height="96"><figcaption>LINE Gift</figcaption></figure></div></div></div>
</section>
<section class="stats" aria-label="สรุป Pool">
<div>สิทธิ์ทั้งหมด<strong id="total">—</strong></div>
<div>บัญชีใน Pool<strong id="members">—</strong></div>
</section>
<section class="panel" aria-label="รายชื่อบัญชี">
<label for="search">ค้นหาบัญชี</label>
<input id="search" type="search" autocomplete="off" placeholder="เช่น naXXX88 หรือ 88">
<p id="status" role="status"></p>
<table><thead><tr><th scope="col">ชื่อบัญชี</th><th scope="col">จำนวนสิทธิ์</th></tr></thead><tbody id="rows"></tbody></table>
<nav id="pagination" hidden aria-label="เปลี่ยนหน้า">
<button id="prev" type="button">ก่อนหน้า</button><span id="page"></span><button id="next" type="button">ถัดไป</button>
</nav>
</section>
</main>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const byId = id => document.getElementById(id);
  const prizeToggle = byId('prize-toggle');
  const prizeWindow = byId('prize-window');
  prizeToggle.addEventListener('click', () => {
    const paused = prizeWindow.toggleAttribute('data-paused');
    if (!paused) prizeWindow.scrollLeft = 0;
    prizeToggle.textContent = paused ? 'เล่นต่อ' : 'หยุดเลื่อน';
  });
  const data = window.ticketPool;
  if (!data) {
    byId('status').textContent = 'โหลดข้อมูล Pool ไม่สำเร็จ';
    byId('search').disabled = true;
    return;
  }
  const number = new Intl.NumberFormat('th-TH');
  const accounts = data.accounts;
  const size = 15;
  let page = 0;
  byId('demo').hidden = !data.demo;
  byId('updated').textContent = data.updatedAt ? 'อัปเดต ' + new Intl.DateTimeFormat('th-TH', {
    dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Bangkok'
  }).format(new Date(data.updatedAt)) + ' (เวลาไทย)' : '';
  byId('total').textContent = number.format(accounts.reduce((sum, row) => sum + row.tickets, 0));
  byId('members').textContent = number.format(accounts.length);
  function render() {
    const query = byId('search').value.trim().toLowerCase();
    const matches = accounts.filter(row => row.masked.toLowerCase().includes(query));
    const pages = Math.ceil(matches.length / size);
    byId('status').textContent = matches.length ? 'พบ ' + number.format(matches.length) + ' บัญชี'
      : query ? 'ไม่พบบัญชีที่ตรงกับคำค้น' : 'ยังไม่มีสิทธิ์ใน Pool';
    const rows = matches.slice(page * size, (page + 1) * size).map(account => {
      const tr = document.createElement('tr');
      tr.insertCell().textContent = account.masked;
      tr.insertCell().textContent = number.format(account.tickets);
      return tr;
    });
    byId('rows').replaceChildren(...rows);
    byId('pagination').style.display = pages > 1 ? 'flex' : 'none';
    byId('pagination').hidden = pages <= 1;
    byId('page').textContent = 'หน้า ' + (page + 1) + ' / ' + pages;
    byId('prev').disabled = page === 0;
    byId('next').disabled = page + 1 >= pages;
  }
  byId('search').addEventListener('input', () => { page = 0; render(); });
  byId('prev').addEventListener('click', () => { page--; render(); });
  byId('next').addEventListener('click', () => { page++; render(); });
  render();
});
</script>
</body>
</html>
